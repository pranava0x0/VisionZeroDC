name: Refresh baked data

# Re-runs the data pipeline against the live Open Data DC sources and, when the
# baked JSON changes, opens a pull request so the test gate + a human review run
# before anything reaches main. We never commit refreshed data straight to main:
# a source schema change or a degraded fetch should be caught in review, not
# silently deployed. See BACKLOG.md "documented refresh cadence" follow-up.

on:
  schedule:
    # 09:13 UTC every Monday. Off the top of the hour to avoid the cron stampede.
    - cron: '13 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild snapshots from live sources
        run: |
          python3 pipeline/snapshot.py --refresh
          python3 pipeline/hotspots.py --refresh

      - name: Validate rebuilt data
        run: |
          node --test tests/hotspots-data.test.mjs
          python3 tests/test_snapshot.py
          python3 tests/test_hotspots_pipeline.py

      - name: Open PR if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes after refresh — nothing to do."
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          branch="data-refresh/${today}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "Data: scheduled refresh ${today}"
          git push -u origin "$branch" --force
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already open for $branch."
          else
            gh pr create \
              --title "Data: scheduled refresh ${today}" \
              --body "Automated weekly rebuild of the baked crash/hotspot JSON from live Open Data DC sources via \`pipeline/snapshot.py\` and \`pipeline/hotspots.py\`. Review the data diff for source schema drift or implausible counts before merging — the test gate runs on this PR." \
              --base main \
              --head "$branch"
          fi
